name: Stranger
options:
  bundleIdPrefix: com.tk
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.tk.stranger
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: Stranger/Info.plist
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  Stranger:
    type: application
    platform: iOS
    sources:
      - path: Stranger
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: Stranger/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.tk.stranger
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
