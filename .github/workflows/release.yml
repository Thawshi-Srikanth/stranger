name: Build & Auto-Update Release (Android + iOS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Compute Version
        id: version
        run: |
          VERSION_CODE=$(( ${{ github.run_number }} + 1 ))
          VERSION_NAME="1.0.${VERSION_CODE}"
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Prepare Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/stranger-key.jks"
            echo "SIGNING_STORE_FILE=${RUNNER_TEMP}/stranger-key.jks" >> $GITHUB_ENV
          fi

      - name: Build Signed Release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PversionCode=${{ steps.version.outputs.version_code }} \
            -PversionName=${{ steps.version.outputs.version_name }}

      - name: Locate & Rename APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" Stranger.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stranger-android
          path: Stranger.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    needs: build-android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project & Build Unsigned IPA
        working-directory: iosApp
        run: |
          xcodegen generate
          xcodebuild clean build \
            -project Stranger.xcodeproj \
            -scheme Stranger \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="${{ needs.build-android.outputs.version_code }}" \
            MARKETING_VERSION="${{ needs.build-android.outputs.version_name }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Stranger.app Payload/
          zip -r ../Stranger.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stranger-ios
          path: Stranger.ipa

  publish-release:
    name: Publish GitHub Release & Auto-Update Feeds
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate version.json & altstore-source.json
        run: |
          VERSION_CODE="${{ needs.build-android.outputs.version_code }}"
          VERSION_NAME="${{ needs.build-android.outputs.version_name }}"
          REPO="${{ github.repository }}"
          TAG="v${VERSION_NAME}"
          IPA_SIZE=$(stat -c%s Stranger.ipa)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          APK_URL="https://github.com/${REPO}/releases/latest/download/Stranger.apk"
          IPA_URL="https://github.com/${REPO}/releases/latest/download/Stranger.ipa"
          ALTSTORE_URL="https://github.com/${REPO}/releases/latest/download/altstore-source.json"

          cat <<EOF > version.json
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "${APK_URL}",
            "ipaUrl": "${IPA_URL}",
            "altstoreRepoUrl": "${ALTSTORE_URL}",
            "releaseNotes": "Automated release ${TAG} (${BUILD_DATE})"
          }
          EOF

          cat <<EOF > altstore-source.json
          {
            "name": "Stranger Private Repo",
            "identifier": "com.tk.stranger.repo",
            "subtitle": "Private Auto-Update Source for Stranger",
            "description": "Private SideStore / AltStore repository for Stranger iOS auto-updates.",
            "apps": [
              {
                "name": "Stranger",
                "bundleIdentifier": "com.tk.stranger",
                "developerName": "TK",
                "subtitle": "Private Archive",
                "localizedDescription": "Encrypted private chat archive.",
                "iconURL": "https://raw.githubusercontent.com/${REPO}/main/app/src/main/ic_launcher-playstore.png",
                "versions": [
                  {
                    "version": "${VERSION_NAME}",
                    "buildVersion": "${VERSION_CODE}",
                    "date": "${BUILD_DATE}",
                    "localizedDescription": "Automated build ${TAG}",
                    "downloadURL": "https://github.com/${REPO}/releases/download/${TAG}/Stranger.ipa",
                    "size": ${IPA_SIZE},
                    "minOSVersion": "16.0"
                  }
                ]
              }
            ]
          }
          EOF

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-android.outputs.version_name }}
          name: Stranger v${{ needs.build-android.outputs.version_name }}
          body: |
            ### Automated Android & iOS Release (v${{ needs.build-android.outputs.version_name }})
            - **Android**: Download `Stranger.apk` (or use in-app **Update Now** / **Profile → Check Updates**).
            - **iOS (SideStore / AltStore Auto-Update)**: Add `https://github.com/${{ github.repository }}/releases/latest/download/altstore-source.json` to SideStore/AltStore Sources, or tap **Check Updates** inside the iOS app.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            Stranger.apk
            Stranger.ipa
            version.json
            altstore-source.json
